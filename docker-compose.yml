services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit-workflow-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIR=/data/chroma
      - AUDIT_DATABASE_URL=sqlite:////data/audit_trail.db
      # Blob storage local de informes generados (spec-011): mismo volumen persistente
      # sqlite_data que ya usa AUDIT_DATABASE_URL, bajo su propio subdirectorio.
      - REPORTS_BLOB_DIR=/data/reports
      - PYTHONUNBUFFERED=1
    volumes:
      - chroma_data:/data/chroma
      - sqlite_data:/data
      # docs/references está en .gitignore (corpus de referencia local, ~50MB de PDFs) y no
      # se hornea en la imagen vía COPY: se bind-montea de solo lectura para no forzar un
      # rebuild cada vez que cambia, y para no distribuir ese contenido dentro de la imagen.
      - ./docs/references:/app/docs/references:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - audit-network
    restart: unless-stopped

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    container_name: audit-workflow-chainlit
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BACKEND_API_URL=http://backend:8000
      - CHROMA_PERSIST_DIR=/data/chroma
      # No usar DATABASE_URL acá: Chainlit lo trata como señal para inicializar su propio
      # data layer de persistencia (Postgres), y crashea /project/settings (asyncpg faltante)
      # dejando la SPA en blanco. AUDIT_DATABASE_URL es leído por app/db.py, no por Chainlit.
      - AUDIT_DATABASE_URL=sqlite:////data/audit_trail.db
      - REPORTS_BLOB_DIR=/data/reports
      - PYTHONUNBUFFERED=1
    volumes:
      - chroma_data:/data/chroma
      - sqlite_data:/data
      - chainlit_cache:/app/.chainlit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - audit-network
    restart: unless-stopped

  # Frontend React (spec-020): reemplaza gradualmente al servicio `chainlit` de arriba, que
  # sigue corriendo en paralelo hasta que este alcance paridad (ver plan de migración). Dev-mode
  # (Vite dev server + proxy /api -> backend): el bind mount trae el código del host para hot
  # reload; `npm install` corrió ya al construir la imagen (Dockerfile.frontend) sobre
  # frontend/package.json, así que no hace falta re-instalar dependencias en cada arranque.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: audit-workflow-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    command:
      [
        "sh",
        "-c",
        "[ -x node_modules/.bin/eslint ] || npm ci --include=dev; npm run dev -- --host 0.0.0.0",
      ]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - audit-network
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
  sqlite_data:
    driver: local
  chainlit_cache:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  audit-network:
    driver: bridge
